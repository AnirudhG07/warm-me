[package]
name = "warm-me"
version = "0.1.0"
edition = "2024"
description = "Keep your laptop warm in the cold by turning spare CPU into heat"
license = "MIT"
repository = "https://github.com/AnirudhG07/warm-me"

[[bin]]
name = "warm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
libc = "0.2.191"
pollster = { version = "1", optional = true }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
starship-battery = "0.12.0"
sysinfo = "0.40.0"
wgpu = { version = "30", optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[features]
# GPU heater for boost mode (Metal / Vulkan / DirectX via wgpu)
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]
